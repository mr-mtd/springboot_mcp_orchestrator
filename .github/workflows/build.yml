name: build

# Docs-only changes (Markdown files) don't build.
on:
  push:
    branches: [main, feature/dev]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The tests run a real MCP server (MCP Java SDK) and a scripted fake of the OpenAI API
      # in-process, so no Docker, database or OpenAI key is needed.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, totals = [], [0, 0, 0, 0]
          for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              s = ET.parse(f).getroot()
              n, fl, er, sk = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              totals = [a + b for a, b in zip(totals, (n, fl, er, sk))]
              rows.append(f"| {s.get('name').rsplit('.', 1)[-1]} | {n} | {fl + er} | {sk} | {float(s.get('time', 0)):.1f}s |")
          print("### Tests\n\n| Class | Tests | Failed | Skipped | Time |\n| --- | --- | --- | --- | --- |")
          print("\n".join(rows))
          print(f"| **Total** | **{totals[0]}** | **{totals[1] + totals[2]}** | **{totals[3]}** | |")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      # Checks that the Dockerfile still builds; the image isn't pushed anywhere.
      - name: Build Docker image
        run: docker build -t transport-mcp-orchestrator:ci .
