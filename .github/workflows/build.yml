name: build

# Docs-only changes (Markdown files) don't build, publish or deploy.
on:
  push:
    branches: [main, feature/dev]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The tests run a real MCP server (MCP Java SDK) and a scripted fake of the OpenAI API
      # in-process, so no Docker, database or OpenAI key is needed.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, totals = [], [0, 0, 0, 0]
          for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              s = ET.parse(f).getroot()
              n, fl, er, sk = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              totals = [a + b for a, b in zip(totals, (n, fl, er, sk))]
              rows.append(f"| {s.get('name').rsplit('.', 1)[-1]} | {n} | {fl + er} | {sk} | {float(s.get('time', 0)):.1f}s |")
          print("### Tests\n\n| Class | Tests | Failed | Skipped | Time |\n| --- | --- | --- | --- | --- |")
          print("\n".join(rows))
          print(f"| **Total** | **{totals[0]}** | **{totals[1] + totals[2]}** | **{totals[3]}** | |")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      # Checks that the Dockerfile still builds; the image isn't pushed anywhere.
      - name: Build Docker image
        run: docker build -t transport-mcp-orchestrator:ci .

  # On pushes to main and feature/dev (not PRs), publish the image to GitHub Container Registry.
  # The EC2 host pulls ghcr.io/mr-mtd/transport-mcp-orchestrator:sha-<commit>.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/transport-mcp-orchestrator
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # After a push to main publishes a new image, restart the orchestrator on the MCP server's EC2
  # host. GitHub signs in to AWS with OIDC (no stored AWS keys) as a role that may only run
  # commands on that one instance. The command installs deploy/ec2/run.sh from this commit, runs it
  # with this commit's image, and waits for /actuator/health to report UP. Skipped until the repo
  # variables below are set.
  #
  # Repository variables (Settings > Secrets and variables > Actions > Variables):
  #   AWS_DEPLOY_ROLE_ARN   arn:aws:iam::<account>:role/transport-orchestrator-github-deploy
  #   EC2_INSTANCE_ID       i-...
  #   CORS_ALLOWED_ORIGINS  optional, comma separated; defaults to the value in run.sh
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull and restart on EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          SCRIPT_B64=$(base64 -w0 deploy/ec2/run.sh)
          CORS_ARG=""
          if [ -n "$CORS_ALLOWED_ORIGINS" ]; then CORS_ARG="CORS_ALLOWED_ORIGINS=$(printf %q "$CORS_ALLOWED_ORIGINS")"; fi
          jq -n --arg b64 "$SCRIPT_B64" --arg tag "sha-$GITHUB_SHA" --arg cors "$CORS_ARG" '{commands: [
            "set -e",
            "mkdir -p /opt/transport-mcp",
            "echo \($b64) | base64 -d > /opt/transport-mcp/run-orchestrator.sh",
            "chmod 700 /opt/transport-mcp/run-orchestrator.sh",
            "IMAGE_TAG=\($tag) \($cors) /opt/transport-mcp/run-orchestrator.sh",
            "for i in $(seq 1 30); do if curl -fs localhost:8082/actuator/health | grep -q UP; then echo healthy; exit 0; fi; sleep 5; done",
            "echo not healthy after 150s; docker logs --tail 80 transport-mcp-orchestrator; exit 1"
          ]}' > params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy orchestrator ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command $COMMAND_ID"

          # Poll instead of `aws ssm wait`, which gives up after 100 s.
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output json \
            | tee result.json
          test "$(jq -r .Status result.json)" = "Success"
